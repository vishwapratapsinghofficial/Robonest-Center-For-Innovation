<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta property="og:image" content="assets/images/logo/robonest-logo.png"><meta property="og:type" content="website"><link rel="icon" href="assets/images/logo/robonest-logo.png"><link rel="stylesheet" href="css/style.css"><!-- Add <link rel="canonical"> once the live domain is known. -->
<title>Admissions Enquiry | ROBONEST Center for Innovation</title>
<meta name="description" content="Send an admission enquiry to ROBONEST Center for Innovation in Haidergarh, Lucknow."></head>
<body><div id="site-header"></div>
<main id="main">
<section class="hero sm"><div class="wrap"><p class="eyebrow">Admissions</p><h1>Take the First Step Toward Innovation</h1><p class="lead" style="margin-bottom:0">Tell us what you want to learn and we will get back to you.</p></div></section>
<section><div class="wrap enq-grid">
<form id="enq" class="card form" novalidate>
<label>Student name *<input name="student" autocomplete="name" required></label>
<label>Parent or guardian name<input name="guardian"></label>
<label>Email *<input name="email" type="email" autocomplete="email" required></label>
<label>Phone *<input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="98765 43210" required></label>
<label>Age group or class<input name="age" placeholder="Optional"></label>
<label>Interested course *<select name="course" required><option value="">Select a course</option></select></label>
<label class="full">Preferred learning mode<select name="mode"><option value="">No preference</option><option>In person</option><option>Online, if available</option></select></label>
<label class="full">Message<textarea name="message" rows="4"></textarea></label>
<label class="full check"><input type="checkbox" name="consent" required><span>I agree to be contacted about this enquiry. *</span></label>
<div class="full"><button class="btn" type="submit">Send enquiry</button></div>
<p class="full" id="status" role="status" aria-live="polite"></p>
</form>
<aside class="card"><h3>Prefer email?</h3><p><a class="link" href="mailto:robonestcenterforinnovation@gmail.com">robonestcenterforinnovation@gmail.com</a></p>
<h3>Location</h3><p>Haidergarh, Lucknow, Uttar Pradesh, India<br><a class="link" href="https://www.google.com/maps/search/?api=1&query=Haidergarh%2C%20Lucknow%2C%20Uttar%20Pradesh%2C%20India" target="_blank" rel="noopener">Open in Google Maps</a></p></aside>
</div></section></main>
<div id="site-footer"></div>
<script defer src="js/data.js"></script><script defer src="js/main.js"></script><script defer src="js/forms.js"></script></body></html>
